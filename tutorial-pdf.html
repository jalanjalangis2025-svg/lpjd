<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panduan PDF - Lapor Jalan</title>
  <link rel="icon" type="image/png" href="images/lambang_kabupaten_demak.png">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/navbar.css">
  <link rel="stylesheet" href="css/landing.css">
  <link rel="stylesheet" href="css/tutorial.css">
</head>

<body>
  <nav class="navbar">
    <div class="container">
      <a href="index.html" class="brand" style="display: flex; align-items: center; gap: 8px;">
        <img src="images/lambang_kabupaten_demak.png" alt="Logo Demak" style="height: 32px; width: auto;">
        <span>LaporJalan</span>
      </a>
      <div class="user-actions">
        <a href="tutorial" class="btn-login" style="background: var(--bg-light); color: var(--text-dark); border: 1px solid var(--border-color);">
          <i class="fas fa-arrow-left"></i> Kembali ke Menu
        </a>
      </div>
    </div>
  </nav>

  <header class="tutorial-hero" style="padding: 40px 0;">
    <div class="container">
      <h1>Panduan Dokumen PDF</h1>
      <p>Gunakan dokumen ini untuk memahami prosedur pelaporan secara detail.</p>
    </div>
  </header>

  <main class="tutorial-container">
    <div class="container">
      <section class="tutorial-card">
        <div class="pdf-wrapper">
          <embed src="Panduan_Lapor.pdf" type="application/pdf" width="100%" height="100%">
        </div>
        <div style="margin-top: 20px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px;">
            <p><strong>Berkas:</strong> Panduan_Lapor.pdf</p>
            <a href="Panduan_Lapor.pdf" download class="download-btn" style="margin-top: 0;">
                <i class="fas fa-download"></i> Unduh PDF
            </a>
        </div>
      </section>
    </div>
  </main>
</body>
</html>
