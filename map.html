<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Peta Sebaran Jalan Rusak</title>
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="images/lambang_kabupaten_demak.png">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/map.css">
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body class="map-page-body">

    <!-- Floating Top Controls -->
    <div class="floating-controls">
        <a href="/" class="btn-back">
            <i class="fas fa-arrow-left"></i>
        </a>

        <div class="filter-group">
            <div class="select-wrapper">
                <i class="fas fa-city"></i>
                <select id="districtFilter" onchange="applyFilters()">
                    <option value="">Semua Kecamatan</option>
                    <!-- Populated by JS -->
                </select>
            </div>

            <div class="select-wrapper">
                <i class="fas fa-filter"></i>
                <select id="statusFilter" onchange="applyFilters()">
                    <option value="all">Semua Status (Pin)</option>
                    <option value="verified">Terverifikasi</option>
                    <option value="pending">Menunggu</option>
                    <option value="rejected">Ditolak</option>
                </select>
            </div>

            <div class="select-wrapper" style="margin-left: 10px;">
                <label style="font-size: 0.85rem; color: #64748b; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 8px;">
                    <input type="checkbox" id="conditionToggle" onchange="toggleConditionLayer()"> 
                    Kondisi Jalan
                </label>
            </div>
        </div>

        <div class="title-badge">
            <i class="fas fa-map"></i> Peta Demak
        </div>
    </div>

    <!-- Map Container (Fullscreen) -->
    <div id="map"></div>

    <!-- Floating Legend -->
    <div class="legend-card" id="mapLegend">
        <h3><i class="fas fa-layer-group"></i> Legenda Peta</h3>
        
        <div class="legend-section" id="statusLegend">
            <h4 class="legend-section-title">Status Laporan (Pin)</h4>
            <div class="legend-item">
                <span class="dot verified"></span>
                <span style="color: #059669; font-weight: 800;">Terverifikasi</span>
            </div>
            <div class="legend-item">
                <span class="dot pending"></span>
                <span style="color: #d97706; font-weight: 800;">Menunggu</span>
            </div>
            <div class="legend-item">
                <span class="dot rejected"></span>
                <span style="color: #dc2626; font-weight: 800;">Ditolak</span>
            </div>
        </div>

        <div class="legend-section" id="conditionLegend">
            <h4 class="legend-section-title">Kondisi Jalan (Garis)</h4>
            <div class="legend-item">
                <span class="line-legend bagus"></span>
                <span style="color: #15803d; font-weight: 800;">Bagus / Baik</span>
                <span class="legend-hint">SDI 0-50</span>
            </div>
            <div class="legend-item">
                <span class="line-legend sedang"></span>
                <span style="color: #a16207; font-weight: 800;">Sedang</span>
                <span class="legend-hint">SDI 50-100</span>
            </div>
            <div class="legend-item">
                <span class="line-legend ringan"></span>
                <span style="color: #c2410c; font-weight: 800;">Rusak Ringan</span>
                <span class="legend-hint">SDI 100-150</span>
            </div>
            <div class="legend-item">
                <span class="line-legend berat"></span>
                <span style="color: #b91c1c; font-weight: 800;">Rusak Berat</span>
                <span class="legend-hint">SDI >150</span>
            </div>
        </div>

        <div class="legend-section">
            <h4 class="legend-section-title">Wilayah</h4>
            <div class="legend-item">
                <span class="dot demak-area"></span>
                <span>Kabupaten Demak</span>
            </div>
        </div>
    </div>

    <!-- Load Scripts -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase.js"></script>
    <script src="js/map.js"></script>
</body>

</html>
